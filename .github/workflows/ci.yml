name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate QML structure
        run: npm run validate

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run biome (lint + format)
        run: npx biome ci .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck install.sh scripts/*.sh

  qmllint:
    name: QML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Qt 6 QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: Lint QML and JavaScript (syntax)
        run: |
          set -euo pipefail
          QMLLINT="$(command -v qmllint6 || command -v qmllint || true)"
          if [ -z "$QMLLINT" ] && [ -x /usr/lib/qt6/bin/qmllint ]; then
            QMLLINT=/usr/lib/qt6/bin/qmllint
          fi
          if [ -z "$QMLLINT" ]; then
            echo "qmllint not found" >&2
            exit 1
          fi
          echo "Using $QMLLINT"

          # The runner has no KDE QML modules, so import/property/type
          # warnings would be all noise. Disable every warning category and
          # keep only real syntax errors. The categories are read from this
          # qmllint's own --help, because Qt renames them between releases
          # (alias -> alias-cycle, property -> missing-property, ...). Run
          # qmllint without these flags on a Plasma 6 system for the full
          # analysis.
          OPTS=""
          for cat in $("$QMLLINT" --help | grep -oE -- '--[A-Za-z.-]+ <lev' | sed 's/ <lev//'); do
            OPTS="$OPTS $cat disable"
          done
          echo "Disabled categories:$OPTS"

          for f in $(
            find org.nan.usage/contents -type f \
              \( -name '*.qml' -o -name '*.js' \)
          ); do

            echo "== $f"
            $QMLLINT $OPTS "$f"
          done

