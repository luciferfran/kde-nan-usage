name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Quota model tests
        run: node org.nan.usage/tests/quotaModel.test.js

      - name: Client helper tests
        run: node org.nan.usage/tests/nanClient.test.js

  qmllint:
    name: qmllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Qt 6 QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: Lint QML and JavaScript (syntax)
        run: |
          set -euo pipefail
          QMLLINT="$(command -v qmllint6 || command -v qmllint || true)"
          if [ -z "$QMLLINT" ] && [ -x /usr/lib/qt6/bin/qmllint ]; then
            QMLLINT=/usr/lib/qt6/bin/qmllint
          fi
          if [ -z "$QMLLINT" ]; then
            echo "qmllint not found" >&2
            exit 1
          fi
          echo "Using $QMLLINT"

          # The runner has no KDE QML modules (Ubuntu 24.04 only ships KF5), so
          # import/property/type warnings would be all noise. Disable every
          # warning category and keep only real syntax errors. Run qmllint
          # without these flags on a Plasma 6 system for the full analysis.
          OPTS="--alias disable --compiler disable --controls-sanity disable"
          OPTS="$OPTS --deferred-property-id disable --deprecated disable"
          OPTS="$OPTS --import disable --inheritance-cycle disable"
          OPTS="$OPTS --multiline-strings disable --multiple-attached-objects disable"
          OPTS="$OPTS --plugin disable --property disable --required disable"
          OPTS="$OPTS --signal disable --type disable --unqualified disable"
          OPTS="$OPTS --unused-imports disable --with disable"

          for f in $(find org.nan.usage/contents -type f \( -name '*.qml' -o -name '*.js' \)); do
            echo "== $f"
            $QMLLINT $OPTS "$f"
          done
