name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Quota model tests
        run: node org.nan.usage/tests/quotaModel.test.js

      - name: Client helper tests
        run: node org.nan.usage/tests/nanClient.test.js

  qmllint:
    name: qmllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Qt 6 QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtqml \
            qml6-module-qtquick-window \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates

      - name: Lint QML and JavaScript
        run: |
          set -euo pipefail
          QMLLINT="$(command -v qmllint6 || command -v qmllint || true)"
          if [ -z "$QMLLINT" ] && [ -x /usr/lib/qt6/bin/qmllint ]; then
            QMLLINT=/usr/lib/qt6/bin/qmllint
          fi
          if [ -z "$QMLLINT" ]; then
            echo "qmllint not found" >&2
            exit 1
          fi
          echo "Using $QMLLINT"
          # QtQuick and the base modules are installed above. The KDE QML modules
          # are not available on the runner, so their failed imports are reported
          # as warnings, not errors. Real syntax errors make qmllint exit non-zero.
          find org.nan.usage/contents -type f \( -name '*.qml' -o -name '*.js' \) -print0 \
            | xargs -0 -n1 "$QMLLINT"
